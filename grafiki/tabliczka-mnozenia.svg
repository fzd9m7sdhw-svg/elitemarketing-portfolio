<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
<title>5 sposobów na skuteczną naukę tabliczki mnożenia — okładka karuzeli (projekt przykładowy)</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Nunito:wght@600;800&amp;display=block');
.h{font-family:'Baloo 2',sans-serif;font-weight:800}.b{font-family:Nunito,sans-serif;font-weight:800}</style>
<defs><pattern id="g" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2"/></pattern>
<filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0B1440" flood-opacity=".3"/></filter></defs>
<rect width="1080" height="1080" fill="#2F5BFF"/><rect width="1080" height="1080" fill="url(#g)"/>
<circle cx="1000" cy="1000" r="300" fill="#2449E0"/>
<g transform="translate(70 70)"><rect width="64" height="64" rx="18" fill="#fff"/><path d="M32 13l6 13 14 2-10 10 2 14-12-7-12 7 2-14-10-10 14-2z" fill="#FFB800"/><text x="80" y="44" class="h" font-size="34" fill="#fff">Szkoła Jutra</text></g>
<g transform="translate(790 74)"><rect width="220" height="56" rx="28" fill="#fff" fill-opacity=".16"/><text x="110" y="38" text-anchor="middle" class="b" font-size="26" fill="#fff">1 / 6</text></g>
<rect x="70" y="200" width="420" height="58" rx="29" fill="#FFD45C"/>
<text x="280" y="240" text-anchor="middle" class="b" font-size="25" fill="#1B2A4A" letter-spacing="2">PORADNIK DLA RODZICÓW</text>
<text x="66" y="440" class="h" font-size="190" fill="#FFD45C">5</text>
<text x="190" y="440" class="h" font-size="104" fill="#FFD45C">sposobów</text>
<text x="70" y="545" class="h" font-size="80" fill="#fff">na skuteczną naukę</text>
<text x="70" y="640" class="h" font-size="80" fill="#fff">tabliczki mnożenia</text>
<text x="72" y="712" class="b" font-size="32" fill="#DCE4FF">Bez wkuwania na pamięć – z zabawą i w 10 minut dziennie.</text>
<g filter="url(#s)">
<g transform="rotate(-8 230 860)"><rect x="90" y="780" width="280" height="150" rx="22" fill="#FFD45C"/><text x="230" y="880" text-anchor="middle" class="h" font-size="64" fill="#1B2A4A">7 × 8 = ?</text></g>
<g transform="rotate(5 545 870)"><rect x="410" y="795" width="270" height="150" rx="22" fill="#9BE7D3"/><text x="545" y="895" text-anchor="middle" class="h" font-size="64" fill="#1B2A4A">3 × 4 = 12</text></g>
<g transform="rotate(-4 860 860)"><rect x="725" y="785" width="270" height="150" rx="22" fill="#FF8A8A"/><text x="860" y="885" text-anchor="middle" class="h" font-size="64" fill="#fff">9 × 9 = 81</text></g>
</g>
<text x="72" y="1028" class="b" font-size="30" fill="#fff">Przesuń, aby poznać sposoby</text>
<g transform="translate(940 994)"><circle r="40" fill="#fff"/><path d="M-14 0h26M2-12l12 12-12 12" stroke="#2F5BFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
<g fill="#fff"><circle cx="560" cy="1018" r="9"/><circle cx="590" cy="1018" r="7" fill-opacity=".45"/><circle cx="615" cy="1018" r="7" fill-opacity=".45"/><circle cx="640" cy="1018" r="7" fill-opacity=".45"/><circle cx="665" cy="1018" r="7" fill-opacity=".45"/><circle cx="690" cy="1018" r="7" fill-opacity=".45"/></g>
<path d="M940 300l12 26 29 4-21 20 5 29-25-14-25 14 5-29-21-20 29-4z" fill="#FFD45C"/>
<circle cx="860" cy="420" r="14" fill="#9BE7D3"/><circle cx="990" cy="520" r="10" fill="#FF8A8A"/>
</svg>
