<defs><linearGradient id="d" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2d6a"/><stop offset="1" stop-color="#7a1d6b"/></linearGradient></defs>
<rect width="1200" height="675" fill="#0a0e1a"/>
<path d="M940 0h260v300z" fill="url(#d)"/><path d="M880 0h80l240 240v80z" fill="#151b30"/>
