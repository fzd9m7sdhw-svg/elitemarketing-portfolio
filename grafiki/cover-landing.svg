<text class="m" font-size="14" fill="#a8b0c4"><tspan x="34" y="266">Landing page dopasowany do</tspan><tspan x="34" y="286">celów, który przyciąga klientów</tspan><tspan x="34" y="306">i generuje wyniki.</tspan></text>
