<text x="74" y="150" class="x" font-size="64" fill="#fff" letter-spacing="-2">Elite<tspan fill="#ff2d6a">Marketing</tspan></text>
<rect x="76" y="186" width="124" height="4" rx="2" fill="#ff2d6a"/>
<text x="72" y="310" class="x" font-size="104" fill="#fff" letter-spacing="-4">Landing page</text>
