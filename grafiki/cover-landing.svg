<rect x="76" y="468" width="124" height="4" rx="2" fill="#ff2d6a"/>
<text x="76" y="545" class="x" font-size="40" fill="#fff">5–7 dni <tspan fill="#ff2d6a">· od 1200 zł</tspan></text>
<g transform="translate(750 58)">
<rect width="290" height="570" rx="46" fill="#1a1f30" stroke="#3a4058" stroke-width="3"/>
<rect x="12" y="12" width="266" height="546" rx="36" fill="#0b1020"/>
